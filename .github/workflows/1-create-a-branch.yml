# ──────────────────────────────────────────────────────────────────
# WORKFLOW: Step 1 — Create a Branch
# ──────────────────────────────────────────────────────────────────
# What this does (in plain English):
#   This workflow watches for the creation of a NEW BRANCH.
#   When a branch named exactly "my-first-branch" is created,
#   and the learner is currently on Step 1,
#   it automatically advances the course to Step 2.
#
# Why "my-first-branch" specifically?
#   The course is automated — GitHub Actions needs to know which
#   branch to look for. The exact name is required so the system
#   knows the right action happened.
# ──────────────────────────────────────────────────────────────────

name: Step 1, Create a branch

# ── TRIGGERS ───────────────────────────────────────────────────────
on:
  workflow_dispatch:   # Can be run manually from the Actions tab

  create:
  # "create" = run this workflow whenever a branch OR tag is created
  # We narrow it down further in the "if:" condition below

# ── PERMISSIONS ────────────────────────────────────────────────────
permissions:
  contents: write   # Allowed to read files and push commits

# ── JOBS ───────────────────────────────────────────────────────────
jobs:

  # ── JOB 1: Read the current step number ────────────────────────
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
        # Reads the number inside .github/steps/-step.txt
        # (This file contains "1" when the learner is on step 1)

    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  # ── JOB 2: Advance to Step 2 if conditions are met ─────────────
  on_create_a_branch:
    name: On create a branch
    needs: get_current_step

    # Run ONLY when ALL of the following are true:
    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 1
          && github.ref_type == 'branch'
          && github.ref_name == 'my-first-branch' }}
    # Condition 1: Not the template repo (only real learner repos)
    # Condition 2: We're on Step 1 (don't run if already on step 2 or 3)
    # Condition 3: The thing created is a BRANCH (not a tag)
    # Condition 4: The branch is named exactly "my-first-branch"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Get all branches and full history

      # Swap Step 1 content → Step 2 content in the README
      - name: Update to step 2
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 1
          to_step: 2
          branch_name: my-first-branch

