# ──────────────────────────────────────────────────────────────────
# WORKFLOW: Step 4 — Merge Your Pull Request
# ──────────────────────────────────────────────────────────────────
# What this does (in plain English):
#   This workflow watches the "main" branch for new commits.
#   When the learner merges their PR (which pushes commits to main),
#   and they're on Step 4,
#   it shows the final congratulations/finish page.
#
# Merging = combining your branch's changes into the main project.
# When a PR is merged, the branch's commits get added to "main".
# That push to "main" is what triggers this workflow.
# ──────────────────────────────────────────────────────────────────

name: Step 4, Merge your pull request

# ── TRIGGERS ───────────────────────────────────────────────────────
on:
  workflow_dispatch:   # Can be triggered manually from the Actions tab

  push:
    branches:
      - main
    # Watch "main" for pushes — a merge into main causes a push to main

# ── PERMISSIONS ────────────────────────────────────────────────────
permissions:
  contents: write   # Allowed to update the step counter and README

# ── JOBS ───────────────────────────────────────────────────────────
jobs:

  # ── JOB 1: Read the current step number ────────────────────────
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
        # The file contains "4" while the learner is on step 4

    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  # ── JOB 2: Show the finish page if conditions are met ──────────
  on_merge_your_pull_request:
    name: On merge your pull request
    needs: get_current_step

    # Run ONLY when ALL of the following are true:
    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 4 }}
    # Condition 1: Not the template repo
    # Condition 2: Currently on Step 4
    # (We trust that if we're on step 4 and something was pushed to main,
    #  it's the merge we're waiting for)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Get full history

      # Swap Step 4 content → Finish/Congratulations content in the README
      - name: Update to step X
        uses: skills/action-update-step@v2
        # "X" is a special step that represents "finished" — not a number
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 4
          to_step: X    # X = done! Shows the congratulations message
          branch_name: my-first-branch

