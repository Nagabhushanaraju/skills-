# ──────────────────────────────────────────────────────────────────
# WORKFLOW: Step 3 — Open a Pull Request
# ──────────────────────────────────────────────────────────────────
# What this does (in plain English):
#   This workflow watches for Pull Requests being opened.
#   When the learner opens a PR from "my-first-branch" → "main",
#   and they're on Step 3,
#   it automatically advances the course to Step 4.
#
# A Pull Request (PR) = a way of saying "I'm done with my changes.
# Can someone review them before adding them to the main project?"
# ──────────────────────────────────────────────────────────────────

name: Step 3, Open a pull request

# ── TRIGGERS ───────────────────────────────────────────────────────
on:
  workflow_dispatch:   # Can be triggered manually from the Actions tab

  pull_request:
    types:
      - opened     # Run when a new PR is opened
      - reopened   # Also run if a previously closed PR is reopened
    # Note: we don't need to specify the branch here because we
    # check it in the "if:" condition below

# ── PERMISSIONS ────────────────────────────────────────────────────
permissions:
  contents: write   # Allowed to update the step counter and README

# ── JOBS ───────────────────────────────────────────────────────────
jobs:

  # ── JOB 1: Read the current step number ────────────────────────
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
        # The file contains "3" while the learner is on step 3

    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  # ── JOB 2: Advance to Step 4 if conditions are met ─────────────
  on_open_a_pull_request:
    name: On open a pull request
    needs: get_current_step

    # Run ONLY when ALL of the following are true:
    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 3
          && github.head_ref == 'my-first-branch' }}
    # Condition 1: Not the template repo
    # Condition 2: Currently on Step 3
    # Condition 3: The PR's source branch is "my-first-branch"
    #              (github.head_ref = the branch being proposed for merging)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: my-first-branch
          # Important: for pull_request events, GitHub checks out the
          # merge commit by default — but we need the actual branch.
          # So we explicitly check out my-first-branch here.

      # Swap Step 3 content → Step 4 content in the README
      - name: Update to step 4
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 3
          to_step: 4
          branch_name: my-first-branch

